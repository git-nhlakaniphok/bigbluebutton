    font-weight="800"
    letter-spacing="-1.8"
  >Netademix</text>

  <!-- Accent link under -mix -->
  <line x1="430" y1="118" x2="575" y2="118" stroke="#29B6F6" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="582" cy="118" r="5" fill="#29B6F6"/>
